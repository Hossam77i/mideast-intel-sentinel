name: Autonomous MidEast Sentinel Scraper

on:
  schedule:
    # Run every 2 hours to keep data fresh without exhausting Vercel's 100 builds/day limit (12 builds a day)
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper and update database
        run: |
          python scripts/github_scraper.py

      - name: Commit and push updated database to trigger Vercel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sentinel.db
          git commit -m "Automated database update: fresh intelligence" || echo "No new intelligence"
          git push
